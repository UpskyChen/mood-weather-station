<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="心情天氣站：給輔導室與班級輔導課使用的原創情緒教育小遊戲。不登入、不上傳、不留紀錄。">
<meta name="theme-color" content="#EDF2F6">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='9' fill='%23C9821C'/%3E%3Cpath d='M20 3v6M20 31v6M3 20h6M31 20h6M8 8l4 4M28 28l4 4M8 32l4-4M28 12l4-4' stroke='%23C9821C' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<title>心情天氣站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout：首頁主角是「舒服 × 有精神」的 2×2 心情天氣圖，下方一排站牌進各遊戲；每個遊戲是單欄全寬頁，頂端固定「回天氣站 / 我需要幫忙」 */
:root{
  --bg:#EDF2F6; --surface:#FFFFFF; --surface-2:#F5F8FB; --ink:#22314A; --muted:#58697F; --line:#D2DCE6;
  --sun:#C9821C; --sun-t:#FCEED6; --breeze:#2F8B70; --breeze-t:#DCF0E8;
  --storm:#C0503F; --storm-t:#F8E0DA; --rain:#5167AE; --rain-t:#E1E6F6;
  --accent:#2C5DA8; --hand:#6E45A8; --on-hand:#FFFFFF; --hand-t:#EEE5F8;
  --ok:#2F8B70; --paper:#FFFFFF; --paper-ink:#1F2733; --paper-line:#AEB9C6;
  --accent-t:#DCE7F7; --sky1:#C6DFF6; --sky2:#E0ECF8; --sky3:#EDF2F6; --cloud:#FFFFFF; --orb:#F6C453; --ray-o:1; --moon-o:0; --star-o:0; --deco-o:.17;
  --f-display:"Huninn","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131A25; --surface:#1C2532; --surface-2:#18202B; --ink:#E5EBF2; --muted:#A2AFC1; --line:#2E3A4B;
    --sun:#F0B455; --sun-t:#3A2E1B; --breeze:#5CC4A3; --breeze-t:#163128;
    --storm:#EE8172; --storm-t:#3B221F; --rain:#93A6E6; --rain-t:#202943;
    --accent:#8DB3EE; --hand:#BC97EA; --on-hand:#1B1226; --hand-t:#2B2140; --ok:#5CC4A3;
    --accent-t:#1D2B42; --sky1:#1B2945; --sky2:#172136; --sky3:#131A25; --cloud:#28354F; --orb:#E9E2C6; --ray-o:0; --moon-o:1; --star-o:.9; --deco-o:.24;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131A25; --surface:#1C2532; --surface-2:#18202B; --ink:#E5EBF2; --muted:#A2AFC1; --line:#2E3A4B;
  --sun:#F0B455; --sun-t:#3A2E1B; --breeze:#5CC4A3; --breeze-t:#163128;
  --storm:#EE8172; --storm-t:#3B221F; --rain:#93A6E6; --rain-t:#202943;
  --accent:#8DB3EE; --hand:#BC97EA; --on-hand:#1B1226; --hand-t:#2B2140; --ok:#5CC4A3;
  --accent-t:#1D2B42; --sky1:#1B2945; --sky2:#172136; --sky3:#131A25; --cloud:#28354F; --orb:#E9E2C6; --ray-o:0; --moon-o:1; --star-o:.9; --deco-o:.24;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,5vw,46px)} h2{font-size:clamp(24px,3.4vw,32px)} h3{font-size:22px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.muted{color:var(--muted)}
.small{font-size:15px}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:12px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.bar h2{flex:1;font-size:24px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:500}
a.btn{text-decoration:none;color:inherit}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.hand{background:var(--hand);color:var(--on-hand);border-color:var(--hand);font-family:var(--f-display);font-size:19px}
.btn.ghost{background:transparent}
.btn.big{min-height:64px;font-size:21px;padding:0 28px}
.btn svg{width:22px;height:22px;flex:none}
.back{min-width:52px;padding:0 16px}

/* ---------- home ---------- */
.home-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:14px}
.home-top .btn.hand{white-space:nowrap}
.sign{display:inline-flex;align-items:center;gap:10px;padding:8px 18px 8px 12px;border-radius:16px;background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.sign svg{width:36px;height:36px;flex:none;color:var(--ink)}
.sign b{font-family:var(--f-display);font-weight:400;font-size:22px;white-space:nowrap}
.hero{position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:1fr minmax(0,1.15fr);gap:32px;align-items:center;margin-top:16px;padding:clamp(20px,3.4vw,36px) clamp(16px,3vw,32px) clamp(12px,2vw,20px);border-radius:28px;background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 62%,var(--sky3) 100%)}
.hero>*{position:relative;z-index:1}
.sky-deco{position:absolute!important;inset:0;z-index:0!important;pointer-events:none}
.sky-deco svg{position:absolute}
.d-orb{width:150px;height:150px;right:-38px;top:-38px}
.d-cloud{fill:var(--cloud);opacity:.9}
.d-cloud.c1{width:120px;top:14px;left:34%}
.d-cloud.c2{width:84px;top:64px;left:52%;opacity:.7}
.d-cloud.c3{width:100px;bottom:26%;left:-24px;opacity:.6}
.d-stars{inset:0;width:100%;height:100%;opacity:var(--star-o)}
@keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(18px)}}
.d-cloud.c1{animation:drift 26s ease-in-out infinite}
.d-cloud.c2{animation:drift 34s ease-in-out infinite reverse}
.hero-copy{display:grid;gap:16px;min-width:0}
.hero-copy .lede{font-size:20px;color:var(--muted);max-width:30em}
.friends{display:grid;grid-template-columns:repeat(4,minmax(0,92px));gap:4px}
.friend{display:grid;justify-items:center;font-size:14px;color:var(--muted);text-align:center}
.friend .face{width:min(72px,100%);height:auto;aspect-ratio:1}
.friend b{font-family:var(--f-display);font-weight:400;color:var(--ink);font-size:17px}

.map{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:34px 0 34px 34px}
.axis{position:absolute;font-size:14px;color:var(--muted);letter-spacing:.06em;font-weight:500}
.axis.y{left:0;top:34px;bottom:34px;width:24px;display:flex;flex-direction:column;justify-content:space-between;align-items:center}
.axis.y span{writing-mode:vertical-rl;text-orientation:upright;letter-spacing:.08em;line-height:1}
.axis.x{left:34px;right:0;bottom:0;display:flex;justify-content:space-between}
.axis.t{left:34px;right:0;top:4px;text-align:center}
.cell{position:relative;isolation:isolate;overflow:hidden;border:none;text-align:left;border-radius:var(--r);padding:16px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;min-height:150px;box-shadow:0 2px 0 color-mix(in srgb,var(--ink) 8%,transparent)}
.cell>*{position:relative;z-index:1}
.cell .zdeco{position:absolute;z-index:0;right:-18px;bottom:-20px;width:112px;height:112px;opacity:var(--deco-o);pointer-events:none}
.z-sun .zdeco{color:var(--sun)} .z-breeze .zdeco{color:var(--breeze)} .z-storm .zdeco{color:var(--storm)} .z-rain .zdeco{color:var(--rain)}
.cell .face{width:76px;height:76px;grid-row:span 3}
.cell .zn{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:22px}
.cell .wx{width:26px;height:26px}
.cell .zd{font-size:15px;color:var(--muted);line-height:1.45}
.cell .zw{font-size:14px;font-weight:500}
.cell:hover{filter:brightness(.98)}
.z-sun{background:var(--sun-t)} .z-sun .zn,.z-sun .zw{color:var(--sun)}
.z-breeze{background:var(--breeze-t)} .z-breeze .zn,.z-breeze .zw{color:var(--breeze)}
.z-storm{background:var(--storm-t)} .z-storm .zn,.z-storm .zw{color:var(--storm)}
.z-rain{background:var(--rain-t)} .z-rain .zn,.z-rain .zw{color:var(--rain)}

.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:28px}
.station{--c:var(--accent);--ct:var(--surface-2);display:grid;grid-template-columns:52px 1fr;gap:4px 14px;align-items:start;text-align:left;padding:18px;border-radius:var(--r);background:var(--surface);border:2px solid var(--line);box-shadow:0 3px 0 var(--line);min-height:112px;text-decoration:none;color:inherit;transition:transform .15s ease,border-color .15s ease}
.station:hover{border-color:var(--c);transform:translateY(-2px)}
.station:active{transform:translateY(1px)}
.station .ico{grid-row:span 2;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--ct);color:var(--c)}
.st-cards{--c:var(--sun);--ct:var(--sun-t)} .st-detective{--c:var(--accent);--ct:var(--accent-t)} .st-match{--c:var(--breeze);--ct:var(--breeze-t)}
.st-thermo{--c:var(--storm);--ct:var(--storm-t)} .st-calm{--c:var(--rain);--ct:var(--rain-t)} .st-print{--c:var(--muted);--ct:var(--surface-2)}
.station .ico svg{width:30px;height:30px}
.station b{font-family:var(--f-display);font-weight:400;font-size:22px}
.station span{font-size:15px;color:var(--muted);line-height:1.45}
.station.help{--c:var(--hand);--ct:var(--surface);background:var(--hand-t);border-color:transparent;box-shadow:none}
.station.help b{color:var(--hand)}
.foot{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;font-size:14px;color:var(--muted)}
.foot a{color:var(--accent)}
.secret{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pin{font:inherit;font-size:28px;letter-spacing:.4em;text-align:center;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);color:var(--ink);width:100%}
.pin-err{color:var(--storm);text-align:center;min-height:1.6em}

/* ---------- face ---------- */
.face{display:block}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-block:8px 18px}
.chip{min-height:46px;padding:0 18px;border-radius:999px;border:2px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:6px;font-weight:500}
.chip .wx{width:20px;height:20px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.zt{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:500;padding:2px 10px;border-radius:999px;background:var(--surface);white-space:nowrap}
.zt .wx{width:15px;height:15px}
.zt.sun{color:var(--sun)} .zt.breeze{color:var(--breeze)} .zt.storm{color:var(--storm)} .zt.rain{color:var(--rain)}

/* ---------- emotion cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
/* 卡片兩面疊在同一格，翻面用 3D 轉動；另外在轉到一半時切換 visibility，
   就算瀏覽器不支援背面隱藏，也不會看到反過來的字 */
.ecard{border:none;padding:0;background:none;border-radius:var(--r);perspective:900px;display:block;text-align:center;min-height:236px}
.ecard .inner{display:grid;height:100%;min-height:236px;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.25,.8,.3,1)}
.ecard.flipped .inner{transform:rotateY(180deg)}
.ecard .cf,.ecard .cb{grid-area:1/1;position:relative;border-radius:var(--r);padding:14px;display:grid;align-content:start;gap:6px;-webkit-backface-visibility:hidden;backface-visibility:hidden;transition:visibility 0s linear .3s}
.ecard .cf{justify-items:center;align-content:center}
.ecard .cb{transform:rotateY(180deg);visibility:hidden;background:var(--surface);border:3px solid var(--zc,var(--line));text-align:left;justify-items:start;font-size:15.5px;line-height:1.5}
.ecard.flipped .cf{visibility:hidden}
.ecard.flipped .cb{visibility:visible}
.ecard .cb.zb-sun{--zc:var(--sun-t)} .ecard .cb.zb-breeze{--zc:var(--breeze-t)} .ecard .cb.zb-storm{--zc:var(--storm-t)} .ecard .cb.zb-rain{--zc:var(--rain-t)}
.ecard:hover .cf{filter:brightness(.985)}
.ecard .face{width:112px;height:112px}
.ecard .w{font-family:var(--f-display);font-size:30px;line-height:1.1}
.ecard .en{font-size:14px;color:var(--muted)}
.ecard .tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.ecard .cb .w{font-size:24px;margin-bottom:2px}
.ecard .cb .dt{font-weight:700;font-size:13px;color:var(--muted);letter-spacing:.04em}
.ecard .cb .dd{margin:0 0 4px}
.ecard .flip{position:absolute;right:12px;top:10px;font-size:12px;color:var(--muted)}

/* ---------- panels / games ---------- */
.panel{background:var(--surface);border-radius:var(--r);padding:clamp(18px,3vw,32px);border:2px solid var(--line)}
.stack{display:grid;gap:18px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.lead{font-size:20px}
.scene{font-family:var(--f-display);font-size:clamp(24px,3.4vw,32px);line-height:1.4}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.opt{min-height:78px;border-radius:18px;border:2px solid var(--line);background:var(--surface-2);font-family:var(--f-display);font-size:26px;display:flex;align-items:center;justify-content:center;gap:10px}
.opt .face{width:46px;height:46px}
.opt:hover{border-color:var(--muted)}
.opt.tried{opacity:.55}
.opt.right{border-color:var(--ok);background:var(--breeze-t)}
.feedback{border-radius:18px;padding:18px 20px;display:grid;gap:8px;font-size:18px}
.feedback.good{background:var(--breeze-t)}
.feedback.soft{background:var(--surface-2);border:2px dashed var(--line)}
.feedback b{font-family:var(--f-display);font-weight:400;font-size:24px}
.book{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 16px;border-radius:18px;background:var(--surface);border:2px dashed var(--line)}
.book-t{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:18px}
.book-t svg{width:22px;height:22px;color:var(--accent)}
.slots{display:flex;flex-wrap:wrap;gap:6px}
.slot{width:34px;height:34px;border-radius:50%;border:2px dashed var(--line);display:grid;place-items:center}
.slot.on{border:2px solid currentColor}
.slot .wx{width:20px;height:20px}
.slot.z-sun{color:var(--sun)} .slot.z-breeze{color:var(--breeze)} .slot.z-storm{color:var(--storm)} .slot.z-rain{color:var(--rain)}
@keyframes pop{0%{transform:scale(.3) rotate(-25deg)}70%{transform:scale(1.18)}100%{transform:none}}
.slot.pop{animation:pop .5s ease-out}
.book-done{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-size:22px}
.book-done .wx{width:30px;height:30px;color:var(--sun);flex:none}
.qface{display:flex;justify-content:center}
.qface .face{width:180px;height:180px}

/* match */
.match{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.mcol{display:grid;gap:12px;align-content:start}
.mitem{min-height:76px;border-radius:18px;border:2px solid var(--line);background:var(--surface-2);text-align:left;padding:14px 16px;display:flex;align-items:center;gap:12px;font-size:18px;line-height:1.45}
.mitem.word{font-family:var(--f-display);font-size:24px;justify-content:center}
.mitem .face{width:44px;height:44px;flex:none}
.mitem.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.mitem.done{border-color:var(--ok);background:var(--breeze-t);cursor:default}
.mitem .pn{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:var(--surface);font-size:15px;font-weight:700}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.nudge{animation:nudge .3s ease 2}

/* thermometer */
.thermo{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:start}
/* 溫度計：左邊是玻璃管和液柱，右邊是 10 到 1 的按鈕；液柱用 clip-path 從下往上露出，顏色從雨天藍、微風綠到晴天黃 */
.meter{display:grid;grid-template-columns:64px auto;grid-template-rows:auto auto;column-gap:14px}
.tube{grid-column:1;grid-row:1;justify-self:center;position:relative;width:36px;border:3px solid var(--line);border-bottom:none;border-radius:999px 999px 0 0;background:var(--surface-2);overflow:hidden}
.liquid{position:absolute;inset:4px 4px 0;border-radius:999px 999px 0 0;background:linear-gradient(to top,var(--rain),var(--breeze) 50%,var(--sun));clip-path:inset(calc(100% - var(--lv,0) * 10%) 0 0 0 round 999px 999px 0 0);transition:clip-path .8s cubic-bezier(.3,.8,.3,1)}
.tube::after{content:"";position:absolute;inset:8px auto 8px 9px;width:5px;border-radius:9px;background:#fff;opacity:.35}
.bulb{grid-column:1;grid-row:2;width:64px;height:64px;margin-top:-4px;border-radius:50%;display:grid;place-items:center;background:var(--bulb,var(--line));border:3px solid var(--line);transition:background-color .6s}
.bulb span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.ticks{grid-column:2;grid-row:1;display:grid;gap:4px}
.tick{min-height:44px;display:flex;align-items:center;gap:10px;padding:0 16px 0 12px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);text-align:left;font-size:16px}
.tick b{width:1.6em;text-align:right;font-size:18px;font-variant-numeric:tabular-nums}
.tick:hover{border-color:var(--muted)}
.tick[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tlabel{font-family:var(--f-display);font-size:30px}
.steps{display:flex;flex-wrap:wrap;gap:6px;font-size:14px;color:var(--muted)}
.steps span{padding:4px 12px;border-radius:999px;background:var(--surface-2);white-space:nowrap}
.steps span.on{background:var(--ink);color:var(--bg)}
.energy{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.energy button{min-height:96px;border-radius:18px;border:2px solid var(--line);background:var(--surface-2);font-size:19px;padding:14px;display:grid;gap:4px}
.energy button b{font-family:var(--f-display);font-weight:400;font-size:24px}
.say{font-family:var(--f-display);font-size:clamp(26px,4vw,36px);line-height:1.4}
.say u{text-decoration-thickness:3px;text-underline-offset:8px;text-decoration-color:var(--line)}

/* calm corner */
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.breath{display:grid;justify-items:center;gap:16px;padding-block:12px}

function eye(cx,cy,t,c){
  const st = `stroke="${c.line}" stroke-width="3" stroke-linecap="round" fill="none"`;
  const ring = c.ring ? ` stroke="${c.ring}" stroke-width="1.8"` : '';

    case 'h': return `<path d="M${cx-6} ${cy+2} Q${cx} ${cy-6} ${cx+6} ${cy+2}" ${st}/>`;
    case 'c': return `<path d="M${cx-6} ${cy-1} Q${cx} ${cy+5} ${cx+6} ${cy-1}" ${st}/>`;
    case 'w': return `<circle cx="${cx}" cy="${cy}" r="6.5" fill="#fff" stroke="${INK}" stroke-width="2"/><circle cx="${cx}" cy="${cy+.5}" r="3.6" fill="${INK}"/><circle cx="${cx+1.4}" cy="${cy-1}" r="1.3" fill="#fff"/>`;
    case 'half': return `<path d="M${cx-5} ${cy} A5 5 0 0 0 ${cx+5} ${cy} Z" fill="${INK}"${ring}/><path d="M${cx-6.5} ${cy} L${cx+6.5} ${cy}" ${st}/>`;
    case 's': return `<ellipse cx="${cx}" cy="${cy}" rx="6.5" ry="4.5" fill="#fff" stroke="${INK}" stroke-width="2"/><circle cx="${cx+3}" cy="${cy+.5}" r="3" fill="${INK}"/><path d="M${cx-7} ${cy-3} L${cx+7} ${cy-4.5}" ${st}/>`;
    default: return `<circle cx="${cx}" cy="${cy}" r="4.8" fill="${INK}"${ring}/><circle cx="${cx+1.5}" cy="${cy-1.6}" r="1.6" fill="#fff"/>`;
  }
}
function mouth(m,mo,mt){
  const cy=88, w=10, st=`stroke="${INK}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"`;
  if(mt==='o') return `<ellipse cx="60" cy="${cy+1}" rx="${f1(3.5+mo*2)}" ry="${f1(2.5+mo*4.5)}" fill="${INK}"/>`;
  if(mt==='zig') return `<path d="M50 ${cy} l5 -2.6 l5 2.6 l5 -2.6 l5 2.6" ${st}/>`;
  if(mo>.05){
    const top = cy + (m>0 ? m*2 : m*7), bot = cy + mo*13 + (m>0 ? m*6 : 0);
    return `<path d="M${60-w} ${cy} Q60 ${f1(top)} ${60+w} ${cy} Q60 ${f1(bot)} ${60-w} ${cy} Z" fill="${INK}"/>`;

function face(ak, x={}, label=''){
  const a = DATA.animals[ak] || DATA.animals.squirrel;
  const sp = SPECIES[a.species||ak](a);
  const c = { line:a.line||INK, ring:a.ring||'' };
  const b=x.b||0, r=x.r||0, m=x.m||0, mo=x.mo||0;
  const by = 58 - r*6;
  const brow=(ox,ix)=>`<path d="M${ox} ${f1(by-b*2)} Q${(ox+ix)/2} ${f1(by-2.5-b*1.5)} ${ix} ${f1(by+b*5)}" stroke="${c.line}" stroke-width="3" stroke-linecap="round" fill="none"/>`;
  let s = `<svg class="face" viewBox="0 0 120 120" ${label?`role="img" aria-label="${label}"`:'aria-hidden="true"'}>`;
  s += sp.back + sp.ears + sp.head + sp.front;
  s += brow(39,53) + brow(81,67);
  s += eye(47,69,x.e||'o',c) + eye(73,69,x.e||'o',c);
  s += mouth(m,mo,x.mt);
  (x.x||[]).forEach(k=>{ s += EXTRA[k] ? EXTRA[k](c) : ''; });
  return s + '</svg>';
}

/* =========================== 情緒偵探 =========================== */
const BOOK=10; /* 偵探手冊一本 10 格；只是集章鼓勵，換頁就重來，不留紀錄 */
let det={log:[],q:null};
function initDetective(){
  det={log:[],q:null};
  $('#v-detective').innerHTML = bar('情緒偵探') + `<div class="stack"><p class="muted">選一個你覺得最像的心情。答案不只一個，說得通就算破案。</p><div class="book" id="stamps"></div><div class="panel stack" id="detq"></div></div>`;
  detNext();
}
function detNext(){
  let q;
  if(Math.random()<.4){
    const w=pick(DATA.words), ak=pick(AK);
    q={kind:'face', zones:w.z, expect:[w.w], ak, word:w, tip:DATA.zones[w.z[0]].tips[0]};
  }else{
    const sc=pick(DATA.scenes);
    q={kind:'scene', zones:sc.z, expect:sc.w, sc, tip:sc.tip};
  }
  const right = WORD[pick(q.expect)];
  const same = shuffle(DATA.words.filter(w=>w!==right && w.z.some(z=>q.zones.includes(z))));
  const diff = shuffle(DATA.words.filter(w=>!overlap(w.z,q.zones)));
  const extra = Math.random()<.5 && same.length ? [same[0]] : [];
  q.opts = shuffle([right, ...extra, ...diff.slice(0, 4-1-extra.length)]);
  det.q=q; det.done=false;
  renderDet();
}
function renderStamps(fresh){
  const n=det.log.length, book=n?Math.floor((n-1)/BOOK)+1:1, inBook=n-(book-1)*BOOK;
  const slots=Array.from({length:BOOK},(_,i)=>{ const z=det.log[(book-1)*BOOK+i];
    return z ? `<span class="slot on z-${z}${fresh&&i===inBook-1?' pop':''}">${WX[z]}</span>` : '<span class="slot"></span>'; }).join('');
  $('#stamps').innerHTML = `<span class="book-t">${ICON.detective}偵探手冊${book>1?`　第 ${book} 本`:''}</span><span class="slots" role="img" aria-label="這本已經破了 ${inBook} 個案子，集滿 ${BOOK} 個完成一本">${slots}</span>`;
}
function renderDet(){
  const q=det.q; renderStamps();
  const head = q.kind==='face'
    ? `<p class="lead">猜猜看，<b>${DATA.animals[q.ak].name}</b>現在是什麼心情？</p><div class="qface">${face(q.ak,q.word.x)}</div>`
    : `<p class="muted small">校園事件</p><p class="scene">${q.sc.t}</p><p class="lead">遇到這件事，可能會有什麼心情？</p>`;
  /* 看事件的題目，選項旁邊畫上表情，幫助還不熟悉字的小朋友；看表情的題目不畫，以免變成找相同的圖 */
  $('#detq').innerHTML = head + `<div class="opts">${q.opts.map(w=>`<button class="opt" data-det="${w.w}">${q.kind==='scene'?optFace(w):''}${w.w}</button>`).join('')}</div><div id="detfb" aria-live="polite"></div>`;
}
function detPick(word, btn){
  const q=det.q; if(det.done) return;
  const w=WORD[word];
  const shared = w.z.filter(z=>q.zones.includes(z));
  if(shared.length){
    det.done=true; det.log.push(shared[0]);
    btn.classList.add('right');
    const zn = shared.map(z=>DATA.zones[z].name).join('、');
    const common = q.expect.includes(word);           /* 是不是大多數人會選的詞 */
    const others = q.expect.filter(e=>e!==word);
    let msg;

function matchWord(i, btn){

function later(fn,ms){ calm.timers.push(setTimeout(fn,ms)); }

function startBreath(btn){
  btn.hidden=true; const orb=$('#orb'), cue=$('#cue'), cue2=$('#cue2');

  const cycle=()=>{
    if(i>=5){ orb.className='orb'; cue.textContent='做得很好！'; cue2.textContent='身體有沒有比較放鬆？想再做一次可以按開始。'; btn.hidden=false; return; }

    later(()=>{ orb.className='orb out'; cue.textContent='吐氣……'; cue2.textContent='慢慢數 1、2、3、4、5、6'; later(cycle,6000); },4000);

function startCount(btn){
  btn.hidden=true; let n=1; const num=$('#cnum'), dots=$$('#cdots i');
  const tick=()=>{ num.textContent=n; dots.forEach((d,j)=>d.classList.toggle('on',j<n));

function stopAudio(){ if(calm.audio){ try{ calm.audio.ctx.close(); }catch(e){} calm.audio=null; } const st=$('#sndst'); if(st) st.textContent=''; }
function playSound(kind){
  stopAudio(); if(kind==='stop') return;
  const AC = window.AudioContext||window.webkitAudioContext; if(!AC){ $('#sndst').textContent='這台裝置不能播放聲音。'; return; }
  const ctx=new AC(); try{ ctx.resume(); }catch(e){}
  const out=ctx.createGain(); out.gain.setValueAtTime(0,ctx.currentTime); out.gain.linearRampToValueAtTime(1, ctx.currentTime+2); out.connect(ctx.destination);
  if(kind==='pad'){
    [[261.63,.05],[329.63,.04],[392,.04],[523.25,.02]].forEach(([f,g],i)=>{
      const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f;
      const gn=ctx.createGain(); gn.gain.value=g; const l=ctx.createOscillator(); l.frequency.value=.07+i*.03; const lg=ctx.createGain(); lg.gain.value=g*.8;
      l.connect(lg); lg.connect(gn.gain); o.connect(gn); gn.connect(out); o.start(); l.start();
    });
  }else{
    const len=ctx.sampleRate*2, buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const src=ctx.createBufferSource(); src.buffer=buf; src.loop=true;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900;
    const g=ctx.createGain(); g.gain.value=.12; src.connect(lp); lp.connect(g); g.connect(out); src.start();
  }
  calm.audio={ctx}; $('#sndst').textContent = kind==='pad'?'正在播放：輕輕的音樂':'正在播放：下雨聲';
}

  pages.push(['wallet',`<h4>求助小卡<small>剪下後放在鉛筆盒或書包裡</small></h4><div class="wallet">${Array.from({length:8},()=>`<div class="pc"><div class="wh">${face('bear',{e:'c',m:.35})}<b>心情很不好的時候</b></div><span>我可以找：</span><span class="fill"></span><span class="fill"></span><span class="say2">我可以說：「我想跟你說一件事。」</span></div>`).join('')}</div>`]);

    <div class="panel stack noprint"><p>勾選要印的內容，然後用瀏覽器的列印功能（電腦按 <b>Ctrl＋P</b>，Mac 按 <b>⌘＋P</b>；iPad 用 Safari 的「分享 → 列印」）。紙張選 A4、邊界「無」、縮放 100%，並勾選「背景圖形」才會印出底色。</p>
      <p class="small muted">建議用電腦的 Chrome 或 Edge 列印，版面最準確。印之前可以先按「預覽列印」確認每張都是一整頁。</p>
      <div class="ptools">${opts.map(([k,n])=>`<label><input type="checkbox" id="pp-${k}" data-pp="${k}" ${PSEL[k]?'checked':''}>${n}</label>`).join('')}</div></div>
    <div class="sheets">${pages.map(([k,h])=>`<div class="sheet" data-pk="${k}" ${PSEL[k]?'':'hidden'}>${h}</div>`).join('')}</div></div>`;
}

/* =========================== 老師設定 =========================== */
const helpWords = ()=>[...new Set([...DATA.words.filter(w=>w.help).map(w=>w.w), ...DATA.help.triggerWords])];
const missWords = ()=>DATA.help.triggerWords.filter(t=>!WORD[t]);
function initTeacher(){
  $('#v-teacher').innerHTML = bar('老師設定與說明') + `<div class="stack">
    <div class="panel stack"><h3>這台裝置的設定</h3><div class="form">
      <label><input type="radio" name="mode" id="mode-room" value="room" ${SET.mode==='room'?'checked':''}><span><b>輔導室模式</b><br><span class="muted small">老師就在旁邊。「我需要幫忙」頁面會先請學生直接跟老師說。</span></span></label>
      <label><input type="radio" name="mode" id="mode-class" value="class" ${SET.mode==='class'?'checked':''}><span><b>教室／家裡模式</b><br><span class="muted small">旁邊不一定有老師。頁面會清楚列出可以找誰、怎麼開口。</span></span></label>
      <label><input type="checkbox" id="set-hotline" ${SET.hotline?'checked':''}><span><b>顯示專線電話</b>（安心專線 1925、保護專線 113）<br><span class="muted small">預設關閉。是否適合國小學生，請輔導老師決定。</span></span></label>
      <label><input type="checkbox" id="set-en" ${SET.en?'checked':''}><span><b>情緒卡顯示英文</b></span></label>
    </div><p class="muted small">設定只存在這台裝置的瀏覽器，不含任何學生資料。</p></div>

    <div class="panel stack"><h3>給使用老師的說明</h3><ul class="stack" style="margin:0;padding-left:1.2em;gap:8px">
      <li><b>不登入、不上傳、不留紀錄。</b>心情溫度計選了什麼都不會存下來，換頁或關掉就消失，下一位學生看不到。</li>
      <li><b>工具不會自動通知任何人。</b>學生按了「我需要幫忙」，需要旁邊的大人主動關心。</li>
      <li><b>沒有分數、沒有排行榜、不記錯題。</b>情緒偵探和情境配對只要選到同一區的心情就算對；如果不是大多數人會選的詞，會補一句「很多人遇到這件事，會先覺得……」，讓學生認識更貼切的詞。情緒偵探的「偵探手冊」只是集章鼓勵，離開遊戲就重來。</li>
      <li><b>情緒分類用「舒服 × 有精神」四區。</b>用天氣命名（晴天、微風、雷雨、雨天），一個詞可以同時在兩區。</li>
      <li><b>四隻動物每一隻都會有各種心情</b>，不綁定某一種情緒，避免「某動物＝某情緒」的聯想。名字暫定，可以讓學生命名。</li>
      <li><b>老師設定頁的進入方式：</b>首頁長按頁尾「心情天氣站 草案…」約 2 秒，或網址加 <code>#teacher</code>，再輸入密碼。密碼在 <code>data.js</code> 的 <code>teacher.pin</code>，請學校自己改。這只是防止學生誤觸，不是資安保護。</li>
      <li><b>要改文字：</b>所有情緒詞、情境、因應方法、求助文字都在 <code>data.js</code>，檔案開頭有修改說明，不用動 <code>index.html</code>。</li>
      <li>可以直接用網址打開某個遊戲，例如網址後面加 <code>#calm</code> 就是冷靜角（給之後 3D 校園的雅雅老師入口用）。</li>
    </ul></div>

    <div class="panel stack"><h3>審稿用：情緒詞（${DATA.words.length} 個）</h3><p class="muted small">全部為原創草擬文字，沒有使用市售品內容。請逐項確認或修改，並補上來源（課綱、公開教材、實務經驗）。</p>
      <div class="tablewrap"><table><thead><tr><th>詞</th><th>區</th><th>意思</th><th>身體的感覺</th><th>英文</th><th>來源／狀態</th></tr></thead><tbody>
      ${DATA.words.map(w=>`<tr><td><b>${w.w}</b>${w.help?'<br><span class="small draft">求助提示詞</span>':''}</td><td>${w.z.map(z=>DATA.zones[z].name).join('<br>')}</td><td>${w.say}</td><td>${w.body}</td><td>${w.en}</td><td class="draft">草案・待審</td></tr>`).join('')}</tbody></table></div></div>

    <div class="panel stack"><h3>審稿用：校園情境卡（${DATA.scenes.length} 張）</h3>
      <div class="tablewrap"><table><thead><tr><th>#</th><th>情境</th><th>區</th><th>可能的心情</th><th>因應方法</th><th>狀態</th></tr></thead><tbody>
      ${DATA.scenes.map((s,i)=>`<tr><td>${i+1}</td><td>${s.t}</td><td>${s.z.map(z=>DATA.zones[z].name).join('<br>')}</td><td>${s.w.join('、')}</td><td>${s.tip}</td><td class="draft">草案・待審</td></tr>`).join('')}</tbody></table></div></div>

    <div class="panel stack"><h3>審稿用：需要幫助時的流程</h3><div class="tablewrap"><table><tbody>
      <tr><th>什麼時候提示</th><td>心情溫度計選到 ${DATA.help.triggerLevel} 度以下；或在溫度計選到「${helpWords().join('、')}」。遊戲裡描述別人的心情時不提示。任何畫面右上角都有「我需要幫忙」。${missWords().length?`<br><span class="draft">注意：「${missWords().join('、')}」不在情緒詞表裡，學生選不到，要先加進 data.js 的 words。</span>`:''}<br><span class="muted small">待決定：計畫書提到的「絕望」等詞，要不要加進詞表和提示條件。</span></td><td class="draft">待審</td></tr>
      <tr><th>提示怎麼說</th><td>${DATA.help.thanks}</td><td class="draft">待審</td></tr>
      <tr><th>帶去哪裡</th><td>${DATA.help.people.map(p=>p.who).join('、')}</td><td class="draft">待審</td></tr>
      <tr><th>輔導室模式</th><td>${DATA.help.roomLine}</td><td class="draft">待審</td></tr>
      <tr><th>專線</th><td>${DATA.help.hotlines.map(h=>`${h.name} ${h.num}（${h.note}）`).join('；')}。預設不顯示。</td><td class="draft">待審</td></tr>
    </tbody></table></div></div>
  </div>`;
}

/* =========================== router & events =========================== */
const VIEWS={home:initHome,cards:initCards,detective:initDetective,match:initMatch,thermo:initThermo,calm:initCalm,help:initHelp,print:initPrint,teacher:initTeacher};
let teacherOK=false;
function askPin(){
  modal(`<form class="stack" id="pinform"><h3 id="modal-t" style="text-align:center">老師專用</h3>
    <p class="muted" style="text-align:center">請輸入密碼</p>
    <input class="pin" id="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off" aria-label="密碼">
    <p class="pin-err" id="pinerr" aria-live="polite"></p>
    <div class="btns"><button class="btn primary big" type="submit">進入</button><button class="btn ghost" type="button" data-act="pin-cancel">取消，回天氣站</button></div></form>`);
  const i=$('#pin'); i && i.focus();
}
function leavePin(){ closeModal(); history.replaceState(null,'','#home'); route(); }
function route(){
  const k = (location.hash||'').slice(1);
  const key = VIEWS[k] ? k : 'home';
  clearCalm(); closeModal();
  if(key!=='teacher') teacherOK=false;
  if(key==='teacher' && !teacherOK){ $$('.view').forEach(v=>{ v.hidden = v.id!=='v-home'; }); initHome(); askPin(); return; }
  $$('.view').forEach(v=>{ v.hidden = v.id!=='v-'+key; });
  VIEWS[key]();
  try{ window.scrollTo(0,0); }catch(e){}
}
function go(k){ if(location.hash==='#'+k) route(); else location.hash=k; }

document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-go]'); if(!t) return;
  const d=t.dataset;
  if(d.act==='help'){ closeModal(); go('help'); return; }
  if(d.act==='close'){ closeModal(); return; }
  if(d.act==='pin-cancel'){ leavePin(); return; }
  if(d.go){ closeModal(); go(d.go); return; }
  if(d.act==='showteacher'){ showTeacher(); return; }
  if(t.id==='showteacher'){ t.hidden=true; return; }
  if(d.zone){ cardFilter=d.zone; go('cards'); return; }
  if(d.filter){ cardFilter=d.filter; $$('[data-filter]').forEach(c=>c.setAttribute('aria-pressed',c.dataset.filter===cardFilter)); renderCards(); return; }
  if(d.card){ t.classList.toggle('flipped'); return; }
  if(d.det!==undefined){ detPick(d.det,t); return; }
  if(d.act==='detnext'){ detNext(); return; }
  if(d.ms!==undefined){ matchScene(+d.ms); return; }
  if(d.mw!==undefined){ matchWord(+d.mw,t); return; }
  if(d.act==='matchnew'){ matchNew(); return; }
  if(d.lv){ th.level=+d.lv; renderThermo(); return; }
  if(d.act==='t-next'){ th.step=2; renderThermo(); if(th.level<=DATA.help.triggerLevel) helpPrompt(); return; }
  if(d.en){ th.energy=d.en; th.step=3; renderThermo(); return; }
  if(d.tw!==undefined){ th.word=d.tw||null; th.step=4; renderThermo(); if(th.word && (WORD[th.word].help || DATA.help.triggerWords.includes(th.word))) helpPrompt(); return; }
  if(d.act==='t-back'){ th.step=Math.max(1,th.step-1); renderThermo(); return; }
  if(d.act==='t-again'){ initThermo(); return; }
  if(d.calm){ initCalm(d.calm); return; }
  if(d.act==='breath'){ startBreath(t); return; }
  if(d.act==='count'){ startCount(t); return; }
  if(d.snd){ playSound(d.snd); return; }
  if(d.act==='sense'){ calm.si++; renderSense(); return; }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.name==='mode'){ SET.mode=t.value; saveSet(); }
  else if(t.id==='set-hotline'){ SET.hotline=t.checked; saveSet(); }
  else if(t.id==='set-en'){ SET.en=t.checked; saveSet(); }
  else if(t.dataset.pp){ PSEL[t.dataset.pp]=t.checked; $$(`.sheet[data-pk="${t.dataset.pp}"]`).forEach(s=>s.hidden=!t.checked); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if($('#pinform')){ leavePin(); return; } if(!$('#modal').hidden) closeModal(); const st=$('#showteacher'); if(!st.hidden) st.hidden=true; } });
$('#modal').addEventListener('click',e=>{ if(e.target.id!=='modal' || downAt<modalAt) return; /* 開窗前就按下的手勢（例如長按放開）不算點外面 */ if($('#pinform')) leavePin(); else closeModal(); });
document.addEventListener('submit',e=>{
  if(e.target.id!=='pinform') return; e.preventDefault();
  if($('#pin').value===String(DATA.teacher.pin)){ teacherOK=true; closeModal(); if(location.hash!=='#teacher') location.hash='teacher'; else route(); }
  else { $('#pinerr').textContent='密碼不對，請再試一次。'; $('#pin').value=''; $('#pin').focus(); }
});
/* 首頁頁尾長按約 2 秒 → 老師設定 */
let pressT=null;
document.addEventListener('pointerdown',e=>{ if(!e.target.closest('#secret')) return; clearTimeout(pressT); pressT=setTimeout(()=>{ pressT=null; go('teacher'); },1800); });
['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev,()=>{ clearTimeout(pressT); pressT=null; },true));
document.addEventListener('contextmenu',e=>{ if(e.target.closest('#secret')) e.preventDefault(); });
window.addEventListener('hashchange',route);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) stopAudio(); });
route();
</script>
</body>
