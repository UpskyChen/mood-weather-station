<title>心情天氣站</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout：首頁主角是「舒服 × 有精神」的 2×2 心情天氣圖，下方一排站牌進各遊戲；每個遊戲是單欄全寬頁，頂端固定「回天氣站 / 我需要幫忙」 */
:root{
  --bg:#EDF2F6; --surface:#FFFFFF; --surface-2:#F5F8FB; --ink:#22314A; --muted:#58697F; --line:#D2DCE6;
  --sun:#C9821C; --sun-t:#FCEED6; --breeze:#2F8B70; --breeze-t:#DCF0E8;
  --storm:#C0503F; --storm-t:#F8E0DA; --rain:#5167AE; --rain-t:#E1E6F6;
  --accent:#2C5DA8; --hand:#6E45A8; --on-hand:#FFFFFF; --hand-t:#EEE5F8;
  --ok:#2F8B70; --paper:#FFFFFF; --paper-ink:#1F2733; --paper-line:#AEB9C6;
  --f-display:"Huninn","PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131A25; --surface:#1C2532; --surface-2:#18202B; --ink:#E5EBF2; --muted:#A2AFC1; --line:#2E3A4B;
    --sun:#F0B455; --sun-t:#3A2E1B; --breeze:#5CC4A3; --breeze-t:#163128;
    --storm:#EE8172; --storm-t:#3B221F; --rain:#93A6E6; --rain-t:#202943;
    --accent:#8DB3EE; --hand:#BC97EA; --on-hand:#1B1226; --hand-t:#2B2140; --ok:#5CC4A3;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131A25; --surface:#1C2532; --surface-2:#18202B; --ink:#E5EBF2; --muted:#A2AFC1; --line:#2E3A4B;
  --sun:#F0B455; --sun-t:#3A2E1B; --breeze:#5CC4A3; --breeze-t:#163128;
  --storm:#EE8172; --storm-t:#3B221F; --rain:#93A6E6; --rain-t:#202943;
  --accent:#8DB3EE; --hand:#BC97EA; --on-hand:#1B1226; --hand-t:#2B2140; --ok:#5CC4A3;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:18px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px;
  -webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1040px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:clamp(30px,5vw,46px)} h2{font-size:clamp(24px,3.4vw,32px)} h3{font-size:22px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.muted{color:var(--muted)}
.small{font-size:15px}

/* ---------- top bar ---------- */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:12px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.bar h2{flex:1;font-size:24px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.hand{background:var(--hand);color:var(--on-hand);border-color:var(--hand);font-family:var(--f-display);font-size:19px}
.btn.ghost{background:transparent}
.btn.big{min-height:64px;font-size:21px;padding:0 28px}
.btn svg{width:22px;height:22px;flex:none}
.back{min-width:52px;padding:0 16px}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:1fr minmax(0,1.15fr);gap:32px;align-items:center;padding-block:28px 8px}
.hero-copy{display:grid;gap:16px;min-width:0}
.hero-copy .lede{font-size:20px;color:var(--muted);max-width:30em}
.friends{display:flex;gap:4px;flex-wrap:wrap}
.friend{display:grid;justify-items:center;width:84px;font-size:14px;color:var(--muted)}
.friend .face{width:72px;height:72px}
.friend b{font-family:var(--f-display);font-weight:400;color:var(--ink);font-size:17px}

.map{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:34px 0 34px 34px}
.axis{position:absolute;font-size:14px;color:var(--muted);letter-spacing:.06em;font-weight:500}
.axis.y{left:0;top:34px;bottom:34px;width:24px;display:flex;flex-direction:column;justify-content:space-between;align-items:center;writing-mode:vertical-rl}
.axis.x{left:34px;right:0;bottom:0;display:flex;justify-content:space-between}
.axis.t{left:34px;right:0;top:4px;text-align:center}
.cell{border:none;text-align:left;border-radius:var(--r);padding:16px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;min-height:150px}
.cell .face{width:76px;height:76px;grid-row:span 3}
.cell .zn{display:flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:22px}
.cell .wx{width:26px;height:26px}
.cell .zd{font-size:15px;color:var(--muted);line-height:1.45}
.cell .zw{font-size:14px;font-weight:500}
.cell:hover{filter:brightness(.98)}
.z-sun{background:var(--sun-t)} .z-sun .zn,.z-sun .zw{color:var(--sun)}
.z-breeze{background:var(--breeze-t)} .z-breeze .zn,.z-breeze .zw{color:var(--breeze)}
.z-storm{background:var(--storm-t)} .z-storm .zn,.z-storm .zw{color:var(--storm)}
.z-rain{background:var(--rain-t)} .z-rain .zn,.z-rain .zw{color:var(--rain)}

.stations{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:28px}
.station{display:grid;grid-template-columns:52px 1fr;gap:4px 14px;align-items:start;text-align:left;padding:18px;border-radius:var(--r);background:var(--surface);border:2px solid var(--line);min-height:112px}
.station:hover{border-color:var(--muted)}
.station .ico{grid-row:span 2;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--surface-2)}
.station .ico svg{width:30px;height:30px}
.station b{font-family:var(--f-display);font-weight:400;font-size:22px}
.station span{font-size:15px;color:var(--muted);line-height:1.45}
.station.help{background:var(--hand-t);border-color:transparent}
.station.help b{color:var(--hand)}
.home-help{display:flex;justify-content:flex-end;padding-top:14px}
.foot{margin-top:36px;padding-top:16px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 24px;justify-content:space-between;font-size:14px;color:var(--muted)}
.foot a{color:var(--accent)}

/* ---------- face ---------- */
.face{display:block}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-block:8px 18px}
.chip{min-height:46px;padding:0 18px;border-radius:999px;border:2px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;gap:6px;font-weight:500}
.chip .wx{width:20px;height:20px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.zt{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:500;padding:2px 10px;border-radius:999px;background:var(--surface);white-space:nowrap}
.zt .wx{width:15px;height:15px}
.zt.sun{color:var(--sun)} .zt.breeze{color:var(--breeze)} .zt.storm{color:var(--storm)} .zt.rain{color:var(--rain)}

/* ---------- emotion cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.ecard{position:relative;border:none;border-radius:var(--r);padding:14px;min-height:236px;display:grid;text-align:center;align-content:start;justify-items:center;gap:6px}
.ecard .face{width:112px;height:112px}
.ecard .w{font-family:var(--f-display);font-size:30px;line-height:1.1}
.ecard .en{font-size:14px;color:var(--muted)}
.ecard .tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.ecard .back{display:none;text-align:left;justify-items:start;gap:8px;font-size:15.5px;line-height:1.5}
.ecard .back .dt{font-weight:700;font-size:13px;color:var(--muted);letter-spacing:.04em}
.ecard .back .dd{margin:0 0 4px}
.ecard.flipped .front{display:none}
.ecard.flipped .back{display:grid}
.ecard .front{display:grid;justify-items:center;gap:6px}
.ecard .flip{position:absolute;right:12px;top:10px;font-size:12px;color:var(--muted)}

/* ---------- panels / games ---------- */
.panel{background:var(--surface);border-radius:var(--r);padding:clamp(18px,3vw,32px);border:2px solid var(--line)}
.stack{display:grid;gap:18px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.lead{font-size:20px}
.scene{font-family:var(--f-display);font-size:clamp(24px,3.4vw,32px);line-height:1.4}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.opt{min-height:78px;border-radius:18px;border:2px solid var(--line);background:var(--surface-2);font-family:var(--f-display);font-size:26px;display:flex;align-items:center;justify-content:center;gap:10px}
.opt .face{width:46px;height:46px}
.opt:hover{border-color:var(--muted)}
.opt.tried{opacity:.55}
.opt.right{border-color:var(--ok);background:var(--breeze-t)}
.feedback{border-radius:18px;padding:18px 20px;display:grid;gap:8px;font-size:18px}
.feedback.good{background:var(--breeze-t)}
.feedback.soft{background:var(--surface-2);border:2px dashed var(--line)}
.feedback b{font-family:var(--f-display);font-weight:400;font-size:24px}
.stamps{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:15px;color:var(--muted)}
.stamp{width:26px;height:26px}
.qface{display:flex;justify-content:center}
.qface .face{width:180px;height:180px}

/* match */
.match{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}
.mcol{display:grid;gap:12px;align-content:start}
.mitem{min-height:76px;border-radius:18px;border:2px solid var(--line);background:var(--surface-2);text-align:left;padding:14px 16px;display:flex;align-items:center;gap:12px;font-size:18px;line-height:1.45}
.mitem.word{font-family:var(--f-display);font-size:24px;justify-content:center}
.mitem .face{width:44px;height:44px;flex:none}
.mitem.sel{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.mitem.done{border-color:var(--ok);background:var(--breeze-t);cursor:default}
.mitem .pn{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--ok);color:var(--surface);font-size:15px;font-weight:700}
@keyframes nudge{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.nudge{animation:nudge .3s ease 2}

/* thermometer */
.thermo{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start}
.tube{display:grid;gap:5px;padding:10px;border-radius:999px;background:var(--surface-2);border:2px solid var(--line);width:104px}
.seg{height:44px;border-radius:12px;border:none;font-weight:700;font-size:17px;background:var(--line);color:var(--ink)}
.seg[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:1px}
.bulb{width:84px;height:84px;border-radius:50%;margin:4px auto 0;display:grid;place-items:center;font-family:var(--f-display);font-size:30px;background:var(--surface);border:2px solid var(--line)}
.tlabel{font-family:var(--f-display);font-size:30px}
.steps{display:flex;gap:6px;font-size:14px;color:var(--muted)}
.steps span{padding:4px 12px;border-radius:999px;background:var(--surface-2)}
.steps span.on{background:var(--ink);color:var(--bg)}
.energy{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.energy button{min-height:96px;border-radius:18px;border:2px solid var(--line);background:var(--surface-2);font-size:19px;padding:14px;display:grid;gap:4px}
.energy button b{font-family:var(--f-display);font-weight:400;font-size:24px}
.say{font-family:var(--f-display);font-size:clamp(26px,4vw,36px);line-height:1.4}
.say u{text-decoration-thickness:3px;text-underline-offset:8px;text-decoration-color:var(--line)}

/* calm corner */
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.breath{display:grid;justify-items:center;gap:16px;padding-block:12px}
.orb{width:min(66vw,260px);aspect-ratio:1;max-width:100%;border-radius:50%;background:radial-gradient(circle at 40% 35%,var(--breeze-t),color-mix(in srgb,var(--breeze) 45%,var(--breeze-t)));display:grid;place-items:center;transform:scale(.62);transition:transform 4s ease-in-out}
.orb .face{width:45%;height:45%}
.orb.in{transform:scale(1);transition-duration:4s}
.orb.out{transform:scale(.62);transition-duration:6s}
.cue{font-family:var(--f-display);font-size:32px;min-height:1.3em}
.count{font-family:var(--f-display);font-size:min(36vw,170px);line-height:1;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.dots i{width:18px;height:18px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--breeze)}
.sense{font-family:var(--f-display);font-size:clamp(26px,4vw,34px);line-height:1.4;text-align:center}
.sense .n{font-size:min(28vw,120px);line-height:1;color:var(--breeze);display:block}
@media (prefers-reduced-motion:reduce){.orb,.orb.in,.orb.out{transition:none;transform:none}.nudge{animation:none}}

/* help */
.help-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;background:var(--hand-t);border-radius:var(--r);padding:clamp(18px,3vw,30px)}
.help-hero .face{width:120px;height:120px}
.help-hero p{font-family:var(--f-display);font-size:clamp(22px,3.2vw,30px);line-height:1.45}
.people{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.person{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:6px}
.person b{font-family:var(--f-display);font-weight:400;font-size:22px}
.lines{display:grid;gap:8px}
.lines p{background:var(--surface-2);border-radius:14px;padding:12px 16px;font-size:19px}
.hotline{display:flex;flex-wrap:wrap;gap:12px}
.hotline div{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 18px}
.hotline b{font-size:30px;font-family:var(--f-display);font-weight:400;user-select:all;font-variant-numeric:tabular-nums}
.note{font-size:15px;color:var(--muted);border-left:4px solid var(--line);padding-left:12px}

/* overlays */
.overlay{position:fixed;inset:0;z-index:50;background:color-mix(in srgb,var(--ink) 45%,transparent);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);border-radius:24px;max-width:540px;width:100%;padding:26px;display:grid;gap:16px;max-height:90vh;overflow:auto}
.dialog .face{width:96px;height:96px;margin:0 auto}
.dialog p.big{font-family:var(--f-display);font-size:24px;line-height:1.45;text-align:center}
.dialog .btns{display:grid;gap:10px}
.showteacher{position:fixed;inset:0;z-index:60;background:var(--hand-t);display:grid;place-items:center;text-align:center;padding:24px;border:none;width:100%}
.showteacher .face{width:160px;height:160px;margin:0 auto 16px}
.showteacher h1{font-size:clamp(40px,9vw,80px)}

/* teacher */
.form{display:grid;gap:14px}
.form label{display:flex;gap:12px;align-items:flex-start;font-size:18px}
.form input{width:24px;height:24px;margin-top:3px;flex:none;accent-color:var(--accent)}
.tablewrap{overflow-x:auto;border:2px solid var(--line);border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:15px;min-width:680px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-weight:700;font-size:14px}
.draft{color:var(--storm);font-weight:500;white-space:nowrap}

/* ---------- print ---------- */
.ptools{display:flex;flex-wrap:wrap;gap:10px 20px}
.ptools label{display:flex;gap:8px;align-items:center;font-size:17px}
.ptools input{width:22px;height:22px;accent-color:var(--accent)}
.sheets{overflow-x:auto;display:grid;gap:18px;justify-content:start;padding-bottom:8px}
.sheet{width:210mm;min-height:297mm;background:var(--paper);color:var(--paper-ink);padding:10mm;box-shadow:0 1px 4px rgba(0,0,0,.15);display:grid;align-content:start;gap:4mm;font-family:var(--f-body)}
.sheet h4{margin:0;font-family:var(--f-display);font-weight:400;font-size:14pt;display:flex;justify-content:space-between}
.sheet h4 small{font-family:var(--f-body);font-size:8pt;color:#5b6573}
.pgrid{display:grid;grid-template-columns:repeat(3,63mm);grid-auto-rows:86mm;justify-content:center}
.pc{border:1px dashed var(--paper-line);padding:5mm;display:grid;align-content:start;justify-items:center;text-align:center;gap:2mm;-webkit-print-color-adjust:exact;print-color-adjust:exact;overflow:hidden}
.pc .face{width:38mm;height:38mm}
.pc .pw{font-family:var(--f-display);font-size:24pt;line-height:1.1}
.pc .pz{font-size:9pt;display:flex;gap:2mm;justify-content:center;flex-wrap:wrap}
.pc .pe{font-size:9pt;color:#5b6573}
.pc.b{justify-items:start;text-align:left;font-size:10pt;line-height:1.45;align-content:center}
.pc.b .dt{font-weight:700;font-size:8.5pt;color:#5b6573}
.pc.b .dd{margin:0 0 2mm}
.pc.b .pw{font-size:16pt}
.pc.s{align-content:center;font-family:var(--f-display);font-size:15pt;line-height:1.5}
.pc.s .sn{font-family:var(--f-body);font-size:8pt;color:#5b6573}
.pt-sun{background:#FCEED6}.pt-breeze{background:#DCF0E8}.pt-storm{background:#F8E0DA}.pt-rain{background:#E1E6F6}
.ws{display:grid;gap:6mm;font-size:13pt}
.ws .wsrow{display:grid;grid-template-columns:40mm 1fr;gap:8mm;align-items:start}
.ws .tb{display:grid;gap:1.5mm}
.ws .tb div{border:1.2px solid var(--paper-ink);border-radius:2mm;height:11mm;display:flex;align-items:center;padding-left:3mm;font-size:11pt}
.ws .quad{display:grid;grid-template-columns:1fr 1fr;gap:3mm}
.ws .quad div{border-radius:3mm;padding:3mm;min-height:32mm;font-size:11pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.ws .lineq{border-bottom:1.2px solid var(--paper-ink);height:12mm}
.wallet{display:grid;grid-template-columns:repeat(2,90mm);grid-auto-rows:60mm;justify-content:center;gap:0}
.wallet .pc{align-content:start;justify-items:start;text-align:left;font-size:10.5pt;line-height:1.5}
.wallet .pc .face{width:16mm;height:16mm}
.wallet .fill{border-bottom:1px solid var(--paper-ink);display:block;height:7mm;width:100%}
@page{size:A4;margin:0}
@media print{
  body{background:#fff;padding:0}
  body::before{display:none}
  .noprint,.bar,#v-print>.stack>.panel{display:none!important}
  .view{display:none!important}
  #v-print{display:block!important}
  .sheets{overflow:visible;gap:0}
  .sheet{box-shadow:none;break-after:page;page-break-after:always;width:210mm;min-height:297mm}
  .sheet[hidden]{display:none!important}
}

@media (max-width:820px){
  .hero{grid-template-columns:1fr;gap:12px}
  .match{grid-template-columns:1fr}
}
@media (max-width:560px){
  body{font-size:17px}
  .map{padding:30px 0 30px 28px;gap:8px}
  .axis.y{top:30px;bottom:30px}
  .axis.x,.axis.t{left:28px}
  .cell{grid-template-columns:1fr;min-height:0;padding:12px}
  .cell .face{width:56px;height:56px;grid-row:auto}
  .cell .zd{display:none}
  .thermo{grid-template-columns:1fr;justify-items:center}
  .bar .btn.hand span.long{display:none}

    case 'c': return `<path d="M${cx-6} ${cy-1} Q${cx} ${cy+5} ${cx+6} ${cy-1}" ${st}/>`;
    case 'w': return `<circle cx="${cx}" cy="${cy}" r="6.5" fill="#fff" stroke="${INK}" stroke-width="2"/><circle cx="${cx}" cy="${cy+.5}" r="3.6" fill="${INK}"/><circle cx="${cx+1.4}" cy="${cy-1}" r="1.3" fill="#fff"/>`;
    case 'half': return `<path d="M${cx-5} ${cy} A5 5 0 0 0 ${cx+5} ${cy} Z" fill="${INK}"/><path d="M${cx-6.5} ${cy} L${cx+6.5} ${cy}" ${st}/>`;
    case 's': return `<ellipse cx="${cx}" cy="${cy}" rx="6.5" ry="4.5" fill="#fff" stroke="${INK}" stroke-width="2"/><circle cx="${cx+3}" cy="${cy+.5}" r="3" fill="${INK}"/><path d="M${cx-7} ${cy-3} L${cx+7} ${cy-4.5}" ${st}/>`;
    default: return `<circle cx="${cx}" cy="${cy}" r="4.6" fill="${INK}"/><circle cx="${cx+1.5}" cy="${cy-1.6}" r="1.5" fill="#fff"/>`;
  }
}
function mouth(m,mo,mt){
  const cy=87, w=11, st=`stroke="${INK}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"`;
  if(mt==='o') return `<ellipse cx="60" cy="${cy+1}" rx="${f1(4+mo*2)}" ry="${f1(3+mo*5)}" fill="${INK}"/>`;
  if(mt==='zig') return `<path d="M49 ${cy} l5.5 -3 l5.5 3 l5.5 -3 l5.5 3" ${st}/>`;
  if(mo>.05){
    const top = cy + (m>0 ? m*2 : m*8), bot = cy + mo*16 + (m>0 ? m*8 : 0);
    return `<path d="M${60-w} ${cy} Q60 ${f1(top)} ${60+w} ${cy} Q60 ${f1(bot)} ${60-w} ${cy} Z" fill="${INK}"/>`;
  }
  return `<path d="M${60-w} ${cy} Q60 ${f1(cy+m*11)} ${60+w} ${cy}" ${st}/>`;
}
const star=(x,y,r)=>`<path d="M${x} ${y-r} L${f1(x+r*.28)} ${f1(y-r*.28)} L${x+r} ${y} L${f1(x+r*.28)} ${f1(y+r*.28)} L${x} ${y+r} L${f1(x-r*.28)} ${f1(y+r*.28)} L${x-r} ${y} L${f1(x-r*.28)} ${f1(y-r*.28)}Z" fill="#F2BE3C"/>`;
const EXTRA = {
  blush:`<ellipse cx="37" cy="81" rx="6" ry="3.5" fill="#EE9393" opacity=".7"/><ellipse cx="83" cy="81" rx="6" ry="3.5" fill="#EE9393" opacity=".7"/>`,
  tear:`<path d="M75 74 Q70.5 82 75 85.5 Q79.5 82 75 74Z" fill="#62B3E8"/>`,
  sweat:`<path d="M96 36 Q90 48 96 52 Q102 48 96 36Z" fill="#9BD3F3" stroke="#5DA6D6" stroke-width="1.2"/>`,
  sparkle: star(14,30,7)+star(106,22,5.5),
  zz:`<text x="92" y="32" font-size="16" font-weight="700" fill="#5B6B80" font-family="sans-serif">z</text><text x="103" y="20" font-size="12" font-weight="700" fill="#5B6B80" font-family="sans-serif">z</text>`,
  vein:`<path d="M90 22 Q94 27 99 22 M90 36 Q94 31 99 36 M88 25 Q93 29 88 33 M101 25 Q96 29 101 33" stroke="#D24E44" stroke-width="2.6" fill="none" stroke-linecap="round"/>`,
  heart:`<path d="M101 31 C101 26 94 24 94 30 C94 34 101 37 101 40 C101 37 108 34 108 30 C108 24 101 26 101 31Z" fill="#E56A7C"/>`,
  scribble:`<path d="M91 24 c4 -5 9 3 4 6 c-5 3 -7 -6 0 -6 c7 0 6 9 1 8" stroke="${INK}" stroke-width="1.8" fill="none" stroke-linecap="round"/>`,
  breeze:`<path d="M2 54 q8 -4 15 0 M0 64 q9 -4 17 0" stroke="#6DB8A2" stroke-width="2.6" fill="none" stroke-linecap="round"/>`
};
function face(ak, x={}, label=''){
  const a = DATA.animals[ak] || DATA.animals.squirrel;
  const b=x.b||0, r=x.r||0, m=x.m||0, mo=x.mo||0;
  const by = 57 - r*7;
  const brow=(ox,ix)=>`<path d="M${ox} ${f1(by-b*2)} Q${(ox+ix)/2} ${f1(by-2.5-b*1.5)} ${ix} ${f1(by+b*5)}" stroke="${INK}" stroke-width="3" stroke-linecap="round" fill="none"/>`;
  let s = `<svg class="face" viewBox="0 0 120 120" ${label?`role="img" aria-label="${label}"`:'aria-hidden="true"'}>`;
  s += ears(a);
  s += a.shape==='oval' ? `<ellipse cx="60" cy="64" rx="40" ry="44" fill="${a.head}"/>` : `<circle cx="60" cy="64" r="43" fill="${a.head}"/>`;
  s += deco(a);
  s += `<ellipse cx="60" cy="75" rx="33" ry="27" fill="${a.mask}"/>`;
  s += brow(39,53) + brow(81,67);
  s += eye(47,69,x.e||'o') + eye(73,69,x.e||'o');
  s += mouth(m,mo,x.mt);
  (x.x||[]).forEach(k=>{ s += EXTRA[k]||''; });
  return s + '</svg>';
}

let det={solved:0,q:null};
function initDetective(){
  $('#v-detective').innerHTML = bar('情緒偵探') + `<div class="stack"><div class="row" style="justify-content:space-between"><p class="muted">選一個你覺得最像的心情。同一區的心情都算破案。</p><div class="stamps" id="stamps"></div></div><div class="panel stack" id="detq"></div></div>`;
  detNext();

function detNext(){
  let q;
  if(Math.random()<.4){
    const w=pick(DATA.words), ak=pick(AK);
    q={kind:'face', zones:w.z, expect:[w.w], ak, word:w, tip:DATA.zones[w.z[0]].tips[0]};
  }else{
    const sc=pick(DATA.scenes);
    q={kind:'scene', zones:sc.z, expect:sc.w, sc, tip:sc.tip};
  }
  const right = WORD[pick(q.expect)];
  const same = shuffle(DATA.words.filter(w=>w!==right && w.z.some(z=>q.zones.includes(z))));
  const diff = shuffle(DATA.words.filter(w=>!overlap(w.z,q.zones)));
  const extra = Math.random()<.5 && same.length ? [same[0]] : [];
  q.opts = shuffle([right, ...extra, ...diff.slice(0, 4-1-extra.length)]);
  det.q=q; det.done=false;
  renderDet();
}
function renderStamps(){
  $('#stamps').innerHTML = det.solved ? `破案章 ${Array.from({length:Math.min(det.solved,12)},(_,i)=>`<svg class="stamp" viewBox="0 0 26 26" aria-hidden="true"><circle cx="13" cy="13" r="11" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 13l3.5 3.5L18 10" stroke="currentColor" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>`).join('')}${det.solved>12?` ×${det.solved}`:''}` : '';
}

  const q=det.q; renderStamps();

    ? `<p class="lead">猜猜看，<b>${DATA.animals[q.ak].name}</b>現在是什麼心情？</p><div class="qface">${face(q.ak,q.word.x)}</div>`

  $('#detq').innerHTML = head + `<div class="opts">${q.opts.map(w=>`<button class="opt" data-det="${w.w}">${w.w}</button>`).join('')}</div><div id="detfb" aria-live="polite"></div>`;
}
function detPick(word, btn){
  const q=det.q; if(det.done) return;
  const w=WORD[word];
  if(overlap(w.z,q.zones)){
    det.done=true; det.solved++;
    btn.classList.add('right');

    $('#detfb').innerHTML = `<div class="feedback good"><b>破案！</b><p>「${word}」是${w.z.map(z=>DATA.zones[z].name).join('，也是')}的心情。${others.length?`有人也可能覺得：${others.join('、')}。`:''}</p><p><b style="font-size:18px">可以試試：</b>${q.tip}</p><div><button class="btn primary big" data-act="detnext">下一題</button></div></div>`;

  }else if(th.step===2){
    h = `<h3>身體現在的感覺比較像哪一個？</h3><div class="energy">

      : `<div class="row" style="gap:24px;align-items:center"><div style="width:150px">${face('turtle',{e:'c',m:.3})}</div><div class="stack" style="flex:1;min-width:0">

  }

}

let calm={tab:'breath',timers:[],audio:null};
function clearCalm(){ calm.timers.forEach(clearTimeout); calm.timers=[]; stopAudio(); }
function initCalm(tab){
  clearCalm(); if(tab) calm.tab=tab;
  const tabs=[['breath','慢慢呼吸'],['count','數到 10'],['sound','聽聲音'],['senses','五感找一找']];
  $('#v-calm').innerHTML = bar('心情冷靜角') + `<div class="stack"><div class="tabs" role="group" aria-label="選一種方法">${tabs.map(([k,n])=>`<button class="chip" data-calm="${k}" aria-pressed="${calm.tab===k}">${n}</button>`).join('')}</div><div class="panel" id="cbox"></div></div>`;
  renderCalm();
}
function later(fn,ms){ calm.timers.push(setTimeout(fn,ms)); }
function renderCalm(){
  const c=$('#cbox');
  if(calm.tab==='breath'){
    c.innerHTML = `<div class="breath"><div class="orb" id="orb">${face('turtle',{e:'c',m:.4})}</div><p class="cue" id="cue" aria-live="polite">準備好了嗎？</p><p class="muted" id="cue2">跟著圓圈：變大時吸氣，變小時吐氣。一共 5 次。</p><button class="btn primary big" data-act="breath">開始</button></div>`;
  }else if(calm.tab==='count'){
    c.innerHTML = `<div class="breath"><div class="count" id="cnum" aria-live="polite">1</div><div class="dots" id="cdots">${'<i></i>'.repeat(10)}</div><p class="muted">每數一個數字，就慢慢吐一口氣。</p><button class="btn primary big" data-act="count">開始一起數</button></div>`;
  }else if(calm.tab==='sound'){
    c.innerHTML = `<div class="breath"><div style="width:160px">${face('bear',{e:'c',m:.45,x:['breeze']})}</div><p class="lead" style="text-align:center">選一種聲音，閉上眼睛聽一會兒。<br><span class="muted small">聲音是電腦即時產生的，不需要網路。</span></p><div class="row" style="justify-content:center"><button class="btn big" data-snd="pad">輕輕的音樂</button><button class="btn big" data-snd="rain">下雨聲</button><button class="btn ghost big" data-snd="stop">停止</button></div><p class="muted" id="sndst" aria-live="polite"></p></div>`;
  }else{
    calm.si = 0; renderSense();
  }
}
function renderSense(){
  const s=DATA.calm.senses[calm.si];
  $('#cbox').innerHTML = s ? `<div class="breath"><p class="sense"><span class="n">${s.n}</span>${s.t}</p><p class="muted">慢慢來，不用急。找到了就按下一步。</p><button class="btn primary big" data-act="sense">下一步</button></div>`
    : `<div class="breath"><div style="width:150px">${face('squirrel',{e:'h',m:.6})}</div><p class="sense">做得很好！<br>現在的心情，有沒有不一樣一點？</p><div class="row" style="justify-content:center"><button class="btn big" data-calm="senses">再做一次</button><a class="btn primary big" href="#thermo">去量心情溫度</a></div></div>`;
}
function startBreath(btn){
  btn.hidden=true; const orb=$('#orb'), cue=$('#cue'), cue2=$('#cue2');
  let i=0;
  const cycle=()=>{
    if(i>=5){ orb.className='orb'; cue.textContent='做得很好！'; cue2.textContent='身體有沒有比較放鬆？想再做一次可以按開始。'; btn.hidden=false; return; }
    i++; orb.className='orb in'; cue.textContent='吸氣……'; cue2.textContent=`第 ${i} 次，慢慢數 1、2、3、4`;
    later(()=>{ orb.className='orb out'; cue.textContent='吐氣……'; cue2.textContent='慢慢數 1、2、3、4、5、6'; later(cycle,6000); },4000);
  };
  cycle();
}
function startCount(btn){
  btn.hidden=true; let n=1; const num=$('#cnum'), dots=$$('#cdots i');
  const tick=()=>{ num.textContent=n; dots.forEach((d,j)=>d.classList.toggle('on',j<n));
    if(n<10){ n++; later(tick,1600); } else later(()=>{ num.textContent='10'; btn.textContent='再數一次'; btn.hidden=false; },800); };
  tick();
}
function stopAudio(){ if(calm.audio){ try{ calm.audio.ctx.close(); }catch(e){} calm.audio=null; } const st=$('#sndst'); if(st) st.textContent=''; }
function playSound(kind){
  stopAudio(); if(kind==='stop') return;
  const AC = window.AudioContext||window.webkitAudioContext; if(!AC){ $('#sndst').textContent='這台裝置不能播放聲音。'; return; }
  const ctx=new AC(); try{ ctx.resume(); }catch(e){}
  const out=ctx.createGain(); out.gain.setValueAtTime(0,ctx.currentTime); out.gain.linearRampToValueAtTime(1, ctx.currentTime+2); out.connect(ctx.destination);
  if(kind==='pad'){
    [[261.63,.05],[329.63,.04],[392,.04],[523.25,.02]].forEach(([f,g],i)=>{
      const o=ctx.createOscillator(); o.type='sine'; o.frequency.value=f;
      const gn=ctx.createGain(); gn.gain.value=g; const l=ctx.createOscillator(); l.frequency.value=.07+i*.03; const lg=ctx.createGain(); lg.gain.value=g*.8;
      l.connect(lg); lg.connect(gn.gain); o.connect(gn); gn.connect(out); o.start(); l.start();
    });
  }else{
    const len=ctx.sampleRate*2, buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const src=ctx.createBufferSource(); src.buffer=buf; src.loop=true;
    const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=900;
    const g=ctx.createGain(); g.gain.value=.12; src.connect(lp); lp.connect(g); g.connect(out); src.start();
  }
  calm.audio={ctx}; $('#sndst').textContent = kind==='pad'?'正在播放：輕輕的音樂':'正在播放：下雨聲';
}

/* =========================== router & events =========================== */
const VIEWS={home:initHome,cards:initCards,detective:initDetective,match:initMatch,thermo:initThermo,calm:initCalm,help:initHelp,print:initPrint,teacher:initTeacher};
function route(){
  const k = (location.hash||'').slice(1);
  const key = VIEWS[k] ? k : 'home';
  clearCalm(); closeModal();
  $$('.view').forEach(v=>{ v.hidden = v.id!=='v-'+key; });
  VIEWS[key]();
  try{ window.scrollTo(0,0); }catch(e){}
}
function go(k){ if(location.hash==='#'+k) route(); else location.hash=k; }

document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-go]'); if(!t) return;
  const d=t.dataset;
  if(d.act==='help'){ closeModal(); go('help'); return; }
  if(d.act==='close'){ closeModal(); return; }
  if(d.go){ closeModal(); go(d.go); return; }
  if(d.act==='showteacher'){ showTeacher(); return; }
  if(t.id==='showteacher'){ t.hidden=true; return; }
  if(d.zone){ cardFilter=d.zone; go('cards'); return; }
  if(d.filter){ cardFilter=d.filter; $$('[data-filter]').forEach(c=>c.setAttribute('aria-pressed',c.dataset.filter===cardFilter)); renderCards(); return; }
  if(d.card){ t.classList.toggle('flipped'); return; }
  if(d.det!==undefined){ detPick(d.det,t); return; }
  if(d.act==='detnext'){ detNext(); return; }
  if(d.ms!==undefined){ matchScene(+d.ms); return; }
  if(d.mw!==undefined){ matchWord(+d.mw,t); return; }
  if(d.act==='matchnew'){ matchNew(); return; }
  if(d.lv){ th.level=+d.lv; renderThermo(); return; }
  if(d.act==='t-next'){ th.step=2; renderThermo(); if(th.level<=DATA.help.triggerLevel) helpPrompt(); return; }
  if(d.en){ th.energy=d.en; th.step=3; renderThermo(); return; }
  if(d.tw!==undefined){ th.word=d.tw||null; th.step=4; renderThermo(); if(th.word && (WORD[th.word].help || DATA.help.triggerWords.includes(th.word))) helpPrompt(); return; }
  if(d.act==='t-back'){ th.step=Math.max(1,th.step-1); renderThermo(); return; }
  if(d.act==='t-again'){ initThermo(); return; }
  if(d.calm){ initCalm(d.calm); return; }
  if(d.act==='breath'){ startBreath(t); return; }
  if(d.act==='count'){ startCount(t); return; }
  if(d.snd){ playSound(d.snd); return; }
  if(d.act==='sense'){ calm.si++; renderSense(); return; }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.name==='mode'){ SET.mode=t.value; saveSet(); }
  else if(t.id==='set-hotline'){ SET.hotline=t.checked; saveSet(); }
  else if(t.id==='set-en'){ SET.en=t.checked; saveSet(); }
  else if(t.dataset.pp){ PSEL[t.dataset.pp]=t.checked; $$(`.sheet[data-pk="${t.dataset.pp}"]`).forEach(s=>s.hidden=!t.checked); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(!$('#modal').hidden) closeModal(); const st=$('#showteacher'); if(!st.hidden) st.hidden=true; } });
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') closeModal(); });
window.addEventListener('hashchange',route);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) stopAudio(); });
route();
</script>
